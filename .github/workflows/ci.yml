name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt pytest httpx
      - name: Test
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  docker:
    needs: [test, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t smart-battery-optimizer .
      - name: Smoke test
        run: |
          docker run -d -p 8000:8000 --name app smart-battery-optimizer
          for i in $(seq 1 30); do curl -sf http://localhost:8000/api/health && break; sleep 2; done
          curl -sf -X POST http://localhost:8000/api/optimize -H 'Content-Type: application/json' -d '{}' > /dev/null
          curl -sf http://localhost:8000/ | grep -q "Smart Battery Optimizer"
